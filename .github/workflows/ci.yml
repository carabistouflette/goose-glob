name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain
          key: goose-${{ runner.os }}-${{ hashFiles('GOOSE_REVISION', 'scripts/setup-goose.sh') }}
      - run: make setup
      - run: make check test differential CC=${{ matrix.cc }}
      - run: make sanitize SANITIZER_CC=${{ matrix.cc }}
      - name: Run source discovery example
        run: .toolchain/goose/build/goose run examples/find.goose -- "$PWD"
      - name: Validate competitive adapters (smoke, not performance qualification)
        if: matrix.cc == 'gcc'
        run: python3 bench/run.py --rounds 1 --iterations 64 --compile-iterations 64 --walk-iterations 1 --cpu 0 --label ci-smoke
      - name: Validate frozen corpus and larger collection fixtures (smoke)
        if: matrix.cc == 'gcc'
        run: python3 bench/independent.py --rounds 1 --iterations 64 --compile-iterations 64 --walk-iterations 1 --cpu 0 --label ci-independent
